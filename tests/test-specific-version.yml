name: Test specific sccache version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: 'v0.7.7'
          disable_annotations: 'true'
      - name: Assert sccache is installed
        run: |
          which sccache || { echo "FAIL: sccache not found in PATH"; exit 1; }
          echo "PASS: sccache is installed"
      - name: Assert sccache version matches requested version
        run: |
          INSTALLED_VERSION=$(sccache --version | awk '{print $2}')
          echo "installed version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "0.7.7" ]; then
            echo "FAIL: expected version 0.7.7, got $INSTALLED_VERSION"
            exit 1
          fi
          echo "PASS: sccache version matches expected"
