name: Test sccache setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: sccache
        uses: .
        with:
          version: "v0.7.7"
          disable_annotations: 'true'
      - name: Assert sccache is installed with correct version
        run: |
          which sccache || { echo "FAIL: sccache not found in PATH"; exit 1; }
          INSTALLED_VERSION=$(sccache --version)
          echo "Installed version: $INSTALLED_VERSION"
          if ! echo "$INSTALLED_VERSION" | grep -q "0.7.7"; then
            echo "FAIL: expected version 0.7.7 but got: $INSTALLED_VERSION"
            exit 1
          fi
          echo "PASS: sccache version 0.7.7 is installed"
      - name: Assert RUSTC_WRAPPER is set
        run: |
          echo "RUSTC_WRAPPER: $RUSTC_WRAPPER"
          if [ -z "$RUSTC_WRAPPER" ]; then
            echo "FAIL: RUSTC_WRAPPER is not set"
            exit 1
          fi
          echo "PASS: RUSTC_WRAPPER=$RUSTC_WRAPPER"
