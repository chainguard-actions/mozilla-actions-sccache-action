name: Test basic sccache setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: sccache
        uses: .
        with:
          disable_annotations: 'true'
      - name: Assert sccache is installed
        run: |
          which sccache || { echo "FAIL: sccache not found in PATH"; exit 1; }
          sccache --version
          echo "PASS: sccache is installed"
      - name: Assert RUSTC_WRAPPER is set
        run: |
          echo "RUSTC_WRAPPER: $RUSTC_WRAPPER"
          if [ -z "$RUSTC_WRAPPER" ]; then
            echo "FAIL: RUSTC_WRAPPER is not set"
            exit 1
          fi
          echo "PASS: RUSTC_WRAPPER=$RUSTC_WRAPPER"
