name: Test basic usage (latest sccache)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          disable_annotations: 'true'
      - name: Assert sccache is installed
        run: |
          which sccache || { echo "FAIL: sccache not found in PATH"; exit 1; }
          sccache --version
          echo "PASS: sccache is installed"
      - name: Assert sccache can cache a compilation
        run: |
          sccache --show-stats
          echo "PASS: sccache stats retrieved successfully"
